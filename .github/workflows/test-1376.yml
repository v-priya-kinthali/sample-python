name: Repro _decimal on Python 3.15.0 (Ubuntu)

on:
  push:
    branches:
      - test-973
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.0"

      - name: Repro
        run: python -c "import _decimal"