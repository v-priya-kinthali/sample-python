name: Python workflow

on:
  push:
    branches: [ poc-756-rawapi ]
  workflow_dispatch:
  

jobs:
  build:
    runs-on: windows-11-arm

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.16.0-alpha.1
      # uses: actions/setup-python@v7
      uses: v-priya-kinthali/setup-python@test-413-pr
      with:
        python-version: 3.16.0-alpha.1
        # freethreaded: true

    # - name: Display Python version
    #   run: python --version
    - name: Verify python.exe (free-threaded)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
          python -VV
          python -c "import sys, sysconfig; ft = sysconfig.get_config_var('Py_GIL_DISABLED') == 1; exp = 'freethreaded' in sys.prefix; print(sys.executable, '| free-threaded:', ft); assert ft == exp, f'expected free-threaded={exp}, got {ft}'"
          python3 -c "import sys; print('python3 ->', sys.executable)"
          pip --version
